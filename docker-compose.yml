# SearXNG : métamoteur de recherche auto-hébergé pour le RAG web de l'app.
# Démarrage :  docker compose up -d
# Test     :  http://localhost:8888  (et API JSON : /search?q=test&format=json)
services:
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    ports:
      - "8888:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
    restart: unless-stopped
